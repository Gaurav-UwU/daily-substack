name: Daily Substack post

on:
  schedule:
    # 03:30 UTC = 09:00 IST every day. Adjust to taste.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (write a draft file, do not touch Substack)"
        type: boolean
        default: false
      publish_mode:
        description: "Override publish mode"
        type: choice
        options: ["gate", "draft", "auto"]
        default: "gate"

# Needed so the job can commit the dedupe history back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-substack
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      WARP_PROXY: "socks5h://127.0.0.1:40000"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      NVIDIA_MODEL_REASON: ${{ vars.NVIDIA_MODEL_REASON }}
      SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
      SUBSTACK_COOKIES_STRING: ${{ secrets.SUBSTACK_COOKIES_STRING }}
      SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
      SUBSTACK_PASSWORD: ${{ secrets.SUBSTACK_PASSWORD }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
      # Inputs override the defaults on manual runs; cron uses the right-hand fallback.
      PUBLISH_MODE: ${{ github.event.inputs.publish_mode || vars.PUBLISH_MODE || 'gate' }}
      QUALITY_THRESHOLD: ${{ vars.QUALITY_THRESHOLD || '78' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Cloudflare WARP (free trusted exit IP for publishing)
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl start warp-svc || sudo nohup warp-svc >/tmp/warp-svc.log 2>&1 &
          sleep 6
          warp-cli --accept-tos registration new || warp-cli --accept-tos register || true
          warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy || true
          warp-cli --accept-tos connect || true
          sleep 12
          warp-cli --accept-tos status || true
          echo "=== WARP trace (want warp=on + a non-Azure IP) ==="
          curl -s -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace || echo "WARP socks proxy not responding"

      - name: Run the daily agent
        run: python -u run.py

      - name: Commit dedupe history + archived post
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "daily: ${{ github.run_id }}"
          git push || echo "nothing to push"
